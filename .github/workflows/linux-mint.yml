name: Linux Mint 22 - paquete DEB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'web/**'
      - 'scripts/generate-notices.mjs'
      - 'LICENSE'
      - 'CREDITS.md'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/linux-mint.yml'

permissions:
  contents: read

concurrency:
  group: linux-mint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Obtener código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Instalar bibliotecas de compilación y prueba
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf xdg-utils xvfb xauth desktop-file-utils
      - name: Preparar Rust estable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version
      - name: Preparar avisos de dependencias para Linux
        run: node scripts/generate-notices.mjs x86_64-unknown-linux-gnu
      - name: Compilar paquete Debian para Mint 22 x64
        run: npx --yes @tauri-apps/cli@2.12.1 build --bundles deb -- --locked
      - name: Verificar el paquete
        run: |
          set -euo pipefail
          mkdir -p dist
          cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES-LINUX.txt
          cp src-tauri/target/release/bundle/deb/*.deb dist/
          deb=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb --info "$deb" | tee dist/PACKAGE-INFO.txt
          dpkg-deb --contents "$deb" > dist/PACKAGE-CONTENTS.txt
          grep -q 'xdg-utils' dist/PACKAGE-INFO.txt
          grep -q 'usr/bin/vamo-lite' dist/PACKAGE-CONTENTS.txt
          grep -q 'usr/share/applications/' dist/PACKAGE-CONTENTS.txt
          grep -q 'usr/share/doc/vamo-lite/copyright' dist/PACKAGE-CONTENTS.txt
          sudo apt-get install -y "$PWD/$deb"
          desktop-file-validate '/usr/share/applications/Vamo Lite.desktop'
          ldd /usr/bin/vamo-lite | tee dist/LIBRARIES.txt
          if grep -q 'not found' dist/LIBRARIES.txt; then exit 1; fi
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
      - name: Prueba de arranque sin cuenta de WhatsApp
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 15s xvfb-run -a \
            env GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 \
            /usr/bin/vamo-lite > dist/STARTUP-LOG.txt 2>&1
          status=$?
          set -e
          cat dist/STARTUP-LOG.txt
          test "$status" -eq 124
          if grep -Eiq 'panicked|No se pudo abrir WhatsApp Web|error while running Vamo Lite' dist/STARTUP-LOG.txt; then
            exit 1
          fi
      - name: Guardar paquete y comprobaciones
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vamo-lite-mint22-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 30

