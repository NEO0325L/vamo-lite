[package]
name = "vamo-lite"
version = "0.1.2"
description = "Cliente independiente de WhatsApp Web para Windows y Linux Mint"
authors = ["NEO0325L"]
license = "MIT"
repository = "https://github.com/NEO0325L/vamo-lite"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"



